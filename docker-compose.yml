name: laravel-social-media

x-app-env: &app-env
  DB_CONNECTION: mysql
  DB_HOST: db
  DB_PORT: 3306
  DB_DATABASE: laravel
  DB_USERNAME: laravel
  DB_PASSWORD: secret
  MAIL_MAILER: smtp
  MAIL_HOST: mailpit
  MAIL_PORT: 1025

services:
  app:
    build: ./docker/php
    image: laravel-social-media-app
    volumes:
      - ./src:/var/www
    environment: *app-env
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  nginx:
    image: nginx:alpine
    ports:
      - "8080:80"
    volumes:
      - ./src:/var/www
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - app
    restart: unless-stopped

  # Vite dev server for React (hot reload). Idles until the Laravel project exists.
  vite:
    image: laravel-social-media-app
    working_dir: /var/www
    volumes:
      - ./src:/var/www
    ports:
      - "5173:5173"
    command: >
      sh -c "if [ -f package.json ]; then
               [ -d node_modules ] || npm install;
               npm run dev;
             else
               echo 'No package.json yet - run make create first'; sleep infinity;
             fi"
    restart: unless-stopped

  # Optional background jobs: docker compose --profile queue up -d
  queue:
    image: laravel-social-media-app
    volumes:
      - ./src:/var/www
    environment: *app-env
    command: php artisan queue:work --tries=3
    depends_on:
      db:
        condition: service_healthy
    profiles: ["queue"]
    restart: unless-stopped

  db:
    image: mysql:8.0
    environment:
      MYSQL_DATABASE: laravel
      MYSQL_USER: laravel
      MYSQL_PASSWORD: secret
      MYSQL_ROOT_PASSWORD: root
    ports:
      - "3307:3306"
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  # Catches all outgoing emails (verification, notifications) - UI on :8025
  mailpit:
    image: axllent/mailpit
    ports:
      - "8025:8025"
    restart: unless-stopped

volumes:
  db_data:
